# Builds the binaries and publishes a GitHub release.
#
# Start it either way:
#   - push a tag:  git tag v0.2.0 && git push origin v0.2.0
#   - or Actions > Release > Run workflow, and enter the version (the tag is
#     created on the selected branch's latest commit)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check the version
        run: |
          case "$VERSION" in
            v[0-9]*) ;;
            *) echo "::error::version must look like v1.2.3, got '$VERSION'"; exit 1 ;;
          esac

      # The code generation tests run snippets with python3 (requests), node,
      # go and HTTPie, so install the two that runners don't have.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install snippet runtimes
        run: python -m pip install --quiet requests httpie websockets

      - name: Test
        run: |
          go vet ./...
          go test -race ./...

      - name: Build
        run: ./scripts/release.sh "$VERSION"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
              --target "$GITHUB_SHA" --title "$VERSION" --notes "${notes:-Release $VERSION}"
          fi
